# Klipper Configuration - Ender 5 Pro
# Board: Creality v1.1.5 (Atmega1284p)
# ============================================================
# OpenPivot Printer Platform P-003
# Baseline Version : v1.3
# Frozen           : 2026-09-08
# Git Tag          : printer-p003-baseline-v1.3
#
# Validated:
# - Direct Drive (17HS3401S + Dual Gear)
# - Dual 5015 Cooling
# - BLTouch relocated
# - Input Shaper calibrated
# - Pressure Advance calibrated
# ============================================================

[include mainsail.cfg] # Change to [include fluidd.cfg] if using Fluidd interface
[include timelapse.cfg]


[mcu]
# Creality v1.1.5 MCU (ATmega1284P)
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0

[idle_timeout]
timeout: 1800
# gcode:
#   TURN_OFF_HEATERS
#   M84

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

[stepper_x]
step_pin: PD7
dir_pin: !PC5
enable_pin:!PD6
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC2
position_endstop: 220
position_max: 220
homing_speed: 25
second_homing_speed: 5
homing_retract_dist: 3

[stepper_y]
step_pin: PC6
dir_pin: !PC7
enable_pin: !PD6
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC3
position_endstop: 220
position_max: 220
homing_speed: 20
second_homing_speed: 4
homing_retract_dist: 3

[stepper_z]
step_pin: PB3
dir_pin: !PB2
enable_pin: !PA5
microsteps: 16
rotation_distance: 4  # Adjusted standard metric for Creality 8-bit Z leadscrews
endstop_pin: probe:z_virtual_endstop
#position_endstop: 0.0
position_min: -5.0
position_max: 300
homing_speed: 5

[extruder]
step_pin: PB1
dir_pin: PB0           # Corrected direction logic
enable_pin: !PD6       # Main driver power lane
microsteps: 16
rotation_distance: 23.333 # Your custom precision calibrated distance value
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PD5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA7
min_temp: 0
max_temp: 260
min_extrude_temp: 170
pressure_advance: 0.036
pressure_advance_smooth_time: 0.040
#control: pid
#pid_Kp: 26.880
#pid_Ki: 1.723
#pid_Kd: 104.832


[heater_bed]
heater_pin: PD4
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA6
#control: pid
#pid_Kp: 54.02
#pid_Ki: 0.77
#pid_Kd: 948.18
min_temp: 0
max_temp: 130

[fan]
pin: PB4

[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 25,25
mesh_max: 170,165
probe_count: 9,9
algorithm: bicubic
bicubic_tension: 0.2
fade_start: 1
fade_end: 10

[screws_tilt_adjust]
screw1: 24.5,80
screw2: 194.5,80
screw3: 194.5,220
screw4: 24.5,220
speed: 150
horizontal_move_z: 10
screw_thread: CW-M4

[display] # Restores standard Creality stock screen output pins
lcd_type: st7920
cs_pin: PA3
sclk_pin: PA1
sid_pin: PC1
encoder_pins: ^PD2, ^PD3
click_pin: ^PC0

[force_move]
enable_force_move: True

[bltouch]
sensor_pin: ^PC4
control_pin: PA4               # Pin-27 breakout SIG

x_offset: -2.5
y_offset: -52.0
#z_offset: 0.0

pin_up_reports_not_triggered: True
pin_up_touch_mode_reports_triggered: False
probe_with_touch_mode: False

[safe_z_home]
home_xy_position: 112.5,162
speed: 50
z_hop: 10
z_hop_speed: 5

#####################################################################
# OrcaSlicer compatibility
#####################################################################

# Allow OrcaSlicer to cancel individual objects during a print.
[exclude_object]

# Enable G2/G3 arc commands generated by OrcaSlicer.
[gcode_arcs]
resolution: 0.1



